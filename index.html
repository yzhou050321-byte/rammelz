<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rammel Z.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      cursor: none;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('images/bg.png');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* Hero illustration layer */
    .hero-drawing-wrap {
      position: fixed;
      left: -2%;
      bottom: 0;
      height: 102vh;
      width: 102vw;
      z-index: 1;
      will-change: transform;
    }
    .hero-drawing {
      height: 100%;
      width: 100%;
      object-fit: cover;
      object-position: center bottom;
      mix-blend-mode: multiply;
      opacity: 0.9;
      animation: heroBreathe 5s ease-in-out infinite;
    }
    @keyframes heroBreathe {
      0%, 100% { opacity: 0.82; }
      50%       { opacity: 0.92; }
    }

    /* Navbar */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 18px 32px 0 24px;
    }

    .nav-logo {
      height: 80px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: auto;
    }

    .nav-links a {
      display: block;
      cursor: none;
      transition: transform 0.2s ease;
    }

    .nav-links a:hover {
      transform: scale(1.08) rotate(-2deg);
    }

    .nav-links img {
      height: 80px;
      object-fit: contain;
    }
    .nav-links a:nth-child(1) img { height: 52px; }

    /* Divider line */
    .nav-line {
      position: fixed;
      top: 100px;
      left: 24px;
      right: 24px;
      height: 2px;
      background: linear-gradient(90deg, #b8b0d8, #d4c8e8, #b8b0d8);
      z-index: 10;
      border-radius: 2px;
    }

    /* Name logo center */
    .name-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-42%, -50%);
      z-index: 5;
      width: 58vw;
      max-width: 800px;
      pointer-events: none;
      animation: floatY 4s ease-in-out infinite;
    }

    @keyframes floatY {
      0%, 100% { transform: translate(-42%, -50%); }
      50% { transform: translate(-42%, calc(-50% - 12px)); }
    }

    /* Custom cursor - paw */
    .cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 9999;
      will-change: transform;
      transition: transform 0.05s linear;
    }

    .cursor svg {
      width: 100%;
      height: 100%;
      fill: #a89dc8;
      opacity: 0.85;
    }

    /* Star sparkle trail */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 16px;
      height: 16px;
      animation: sparkle-fade 0.7s ease forwards;
    }

    @keyframes sparkle-fade {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.2) rotate(60deg); }
    }

    /* Page transition overlay */
    .transition-overlay {
      position: fixed;
      inset: 0;
      background: #e8e4f4;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .transition-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    @media (hover: none) {
      body { cursor: auto; }
      .cursor { display: none; }
    }
    @media (max-width: 768px) {
      nav { padding: 10px 14px 0 12px; }
      .nav-logo { height: 46px; }
      .nav-links { gap: 6px; }
      .nav-links img { height: 46px; }
      .nav-links a:nth-child(1) img { height: 36px; }
      .nav-line { top: 66px; left: 12px; right: 12px; }
      .name-logo { width: 90vw; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="hero-drawing-wrap" id="heroWrap">
    <img class="hero-drawing" src="images/hero_drawing.png" alt="">
  </div>

  <!-- Navbar -->
  <nav>
    <a href="index.html"><img class="nav-logo" src="images/logo.png" alt="Rammel Z. Logo"></a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn"><img src="images/nav_home.png" alt="Home"></a>
      <a href="illustration.html" class="nav-btn"><img src="images/nav_ill.png" alt="Illustration"></a>
      <a href="photography.html" class="nav-btn"><img src="images/nav_photo.png" alt="Photography"></a>
      <a href="about.html" class="nav-btn"><img src="images/nav_about.png" alt="About Me"></a>
    </div>
  </nav>

  <div class="nav-line"></div>

  <!-- Name Logo -->
  <img class="name-logo" src="images/name_logo.png" alt="Rammel Z.">

  <!-- Page transition -->
  <div class="transition-overlay" id="overlay"></div>

  <!-- Custom cursor -->
  <div class="cursor" id="cursor">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Paw pad -->
      <ellipse cx="50" cy="62" rx="26" ry="22"/>
      <!-- Toes -->
      <ellipse cx="24" cy="38" rx="12" ry="10"/>
      <ellipse cx="44" cy="28" rx="12" ry="10"/>
      <ellipse cx="64" cy="28" rx="12" ry="10"/>
      <ellipse cx="78" cy="38" rx="12" ry="10"/>
    </svg>
  </div>

  <script>
    // Hero float + mouse parallax
    const heroWrap = document.getElementById('heroWrap');
    let floatT = 0, parallaxX = 0, parallaxY = 0, targetX = 0, targetY = 0;
    (function animateHero() {
      floatT += 0.012;
      const floatY = Math.sin(floatT) * 9;
      parallaxX += (targetX - parallaxX) * 0.05;
      parallaxY += (targetY - parallaxY) * 0.05;
      heroWrap.style.transform = `translate(${parallaxX}px, ${parallaxY + floatY}px)`;
      requestAnimationFrame(animateHero);
    })();

    // Custom cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
      spawnSparkle(e.clientX, e.clientY);
      targetX = (e.clientX / window.innerWidth  - 0.5) * -18;
      targetY = (e.clientY / window.innerHeight - 0.5) * -12;
    });

    // Sparkle trail
    let lastSparkle = 0;
    function spawnSparkle(x, y) {
      const now = Date.now();
      if (now - lastSparkle < 80) return;
      lastSparkle = now;

      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      const colors = ['#c4b8e8', '#f9d4e8', '#b8d8f0', '#ffeea0'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      el.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="${color}" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/>
      </svg>`;
      el.style.width = (10 + Math.random() * 12) + 'px';
      el.style.height = el.style.width;

      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    window.addEventListener('pageshow', () => {
      document.getElementById('overlay').classList.remove('active');
    });

    // Page transition
    document.querySelectorAll('.nav-btn').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href && href !== '#') {
          e.preventDefault();
          const overlay = document.getElementById('overlay');
          overlay.classList.add('active');
          setTimeout(() => { window.location.href = href; }, 300);
        }
      });
    });
  </script>

</body>
</html>
