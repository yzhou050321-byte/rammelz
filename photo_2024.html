<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2024 — Rammel Z.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'Georgia', serif;
      cursor: none;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('images/bg.png');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }
    nav {
      position: relative;
      z-index: 10; display: flex; align-items: center;
      padding: 18px 32px 0 24px;
    }
    .nav-logo { height: 60px; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: 20px; margin-left: auto; }
    .nav-links a { display: block; cursor: none; transition: transform 0.2s ease; }
    .nav-links a:hover { transform: scale(1.08) rotate(-2deg); }
    .nav-links img { height: 80px; object-fit: contain; }
    .nav-links a:nth-child(1) img { height: 52px; }
    .nav-line {
      margin: 0 24px; height: 2px;
      background: linear-gradient(90deg, #b8b0d8, #d4c8e8, #b8b0d8);
      z-index: 10; border-radius: 2px;
    }
    .page-content {
      padding-top: 24px; padding-bottom: 80px;
      padding-left: 5vw; padding-right: 5vw;
    }
    .page-title {
      display: flex; justify-content: center; margin-bottom: 48px;
    }
    .page-title img {
      height: 200px; object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(160,140,210,0.3));
    }

    /* Masonry */
    .gallery-grid {
      columns: 4;
      column-gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .artwork-card {
      cursor: none;
      break-inside: avoid;
      margin-bottom: 24px;
      animation: floatIn 0.5s ease both;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .artwork-img-wrap {
      width: 100%;
      background: rgba(255,255,255,0.55);
      border-radius: 12px; overflow: hidden;
      border: 2px solid rgba(180,160,220,0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .artwork-card:hover .artwork-img-wrap {
      transform: translateY(-6px) rotate(0.5deg);
      box-shadow: 0 12px 32px rgba(160,140,210,0.25);
    }
    .artwork-img-wrap img { width: 100%; height: auto; display: block; }
    .artwork-info { margin-top: 8px; padding: 0 4px; }
    .artwork-title { font-size: 13px; color: #6a5a8a; font-style: italic; }
    .artwork-date { font-size: 11px; color: #a090b8; margin-top: 2px; }

    /* Zine card — clickable, full-width in one column */
    .zine-card {
      cursor: none;
      break-inside: avoid;
      margin-bottom: 24px;
      animation: floatIn 0.5s ease both;
      column-span: none;
    }
    .zine-card .artwork-img-wrap {
      position: relative;
      overflow: hidden;
    }
    .zine-overlay {
      position: absolute; inset: 0;
      background: rgba(140,110,190,0.0);
      transition: background 0.25s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .zine-card:hover .zine-overlay {
      background: rgba(140,110,190,0.18);
    }
    .zine-open-hint {
      opacity: 0; color: #fff;
      font-size: 12px; letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.25s ease;
      background: rgba(100,80,150,0.7);
      padding: 6px 14px; border-radius: 20px;
    }
    .zine-card:hover .zine-open-hint { opacity: 1; }

    /* Flipbook Modal */
    .flipbook-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(18,12,36,0.92); z-index: 500;
      align-items: center; justify-content: center;
    }
    .flipbook-modal.open { display: flex; }
    .flipbook-container {
      position: relative; display: flex; flex-direction: column; align-items: center;
    }
    .flipbook-nav { display: flex; align-items: center; gap: 20px; }
    .flipbook-img-wrap { position: relative; }
    .flipbook-img {
      max-width: 80vw; max-height: 82vh;
      object-fit: contain; border-radius: 8px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6); display: block;
    }
    .flipbook-btn {
      background: rgba(255,255,255,0.14); border: none; color: #fff;
      font-size: 26px; width: 52px; height: 52px; border-radius: 50%;
      cursor: pointer; backdrop-filter: blur(6px);
      transition: background 0.2s; flex-shrink: 0;
    }
    .flipbook-btn:hover { background: rgba(255,255,255,0.28); }
    .flipbook-close {
      position: absolute; top: -48px; right: 0;
      background: rgba(255,255,255,0.14); border: none; color: #fff;
      font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; backdrop-filter: blur(6px); transition: background 0.2s;
    }
    .flipbook-close:hover { background: rgba(255,255,255,0.28); }
    .flipbook-counter {
      text-align: center; color: rgba(255,255,255,0.6);
      font-size: 13px; margin-top: 14px; letter-spacing: 0.05em;
    }

    /* Cursor */
    .cursor {
      position: fixed; width: 32px; height: 32px;
      left: 0; top: 0;
      pointer-events: none; z-index: 9999;
      will-change: transform;
    }
    .cursor svg { width: 100%; height: 100%; fill: #a89dc8; opacity: 0.85; }
    .sparkle {
      position: fixed; pointer-events: none; z-index: 9998;
      animation: sparkle-fade 0.7s ease forwards;
    }
    @keyframes sparkle-fade {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.2) rotate(60deg); }
    }
    .transition-overlay {
      position: fixed; inset: 0; background: #e8e4f4;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .transition-overlay.active { opacity: 1; pointer-events: all; }

    @media (hover: none) {
      body { cursor: auto; }
      .cursor { display: none; }
      .artwork-card, .zine-card { cursor: auto; }
    }
    @media (max-width: 640px) {
      nav { padding: 10px 14px 0 12px; }
      .nav-logo { height: 44px; }
      .nav-links { gap: 6px; }
      .nav-links img { height: 44px; }
      .nav-links a:nth-child(1) img { height: 34px; }
      .nav-line { margin: 0 12px; }
      .page-title img { height: 100px; }
      .page-title { margin-bottom: 20px; }
      .gallery-grid { columns: 2; column-gap: 12px; }
      .artwork-card { margin-bottom: 12px; }
      .flipbook-btn { width: 40px; height: 40px; font-size: 20px; }
      .flipbook-img { max-width: 92vw; max-height: 78vh; }
    }
    .back-btn {
      position: fixed;
      bottom: 28px;
      left: 24px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      border: 2px solid #c4b8e8;
      border-radius: 50px;
      padding: 10px 20px;
      color: #7a6ea0;
      font-family: sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: none;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 12px rgba(168,157,200,0.2);
    }
    .back-btn:hover {
      transform: scale(1.08) rotate(-1deg);
      box-shadow: 0 4px 20px rgba(168,157,200,0.4);
    }
    @media (hover: none) { .back-btn { cursor: auto; } }
    @media (max-width: 640px) {
      .back-btn { bottom: 18px; left: 16px; padding: 8px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html"><img class="nav-logo" src="images/logo.png" alt="Logo"></a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn"><img src="images/nav_home.png" alt="Home"></a>
      <a href="illustration.html" class="nav-btn"><img src="images/nav_ill.png" alt="Illustration"></a>
      <a href="photography.html" class="nav-btn"><img src="images/nav_photo.png" alt="Photography"></a>
      <a href="about.html" class="nav-btn"><img src="images/nav_about.png" alt="About Me"></a>
    </div>
  </nav>
  <div class="nav-line"></div>

  <div class="page-content">
    <div class="page-title">
      <img src="images/photo_2024.png" alt="2024">
    </div>

    <div class="gallery-grid">

      <!-- HIKE Zine — flipbook card -->
      <div class="zine-card" id="zine-open-btn">
        <div class="artwork-img-wrap">
          <img src="images/HIKE-zine1.png" alt="HIKE Zine cover">
          <div class="zine-overlay">
            <span class="zine-open-hint">Open Zine ↗</span>
          </div>
        </div>
        <div class="artwork-info">
          <div class="artwork-title">HIKE — Zine</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>

      <!-- Standalone photos -->
      <div class="artwork-card">
        <div class="artwork-img-wrap">
          <img src="images/flower-2024.JPG" alt="Flower">
        </div>
        <div class="artwork-info">
          <div class="artwork-title">Flower</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>
      <div class="artwork-card">
        <div class="artwork-img-wrap">
          <img src="images/azure-2024.jpg" alt="Azure">
        </div>
        <div class="artwork-info">
          <div class="artwork-title">Azure</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>
      <div class="artwork-card">
        <div class="artwork-img-wrap">
          <img src="images/jellyfish-2024.JPG" alt="Jellyfish">
        </div>
        <div class="artwork-info">
          <div class="artwork-title">Jellyfish</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>
      <div class="artwork-card">
        <div class="artwork-img-wrap">
          <img src="images/a-cat-in-a-swimming-ring-2024.JPG" alt="A Cat in a Swimming Ring">
        </div>
        <div class="artwork-info">
          <div class="artwork-title">A Cat in a Swimming Ring</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>
      <div class="artwork-card">
        <div class="artwork-img-wrap">
          <img src="images/FUJI-mountain-2024.jpg" alt="Fuji Mountain">
        </div>
        <div class="artwork-info">
          <div class="artwork-title">Fuji Mountain</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>
      <div class="artwork-card">
        <div class="artwork-img-wrap">
          <img src="images/untitled-2024.jpg" alt="Untitled">
        </div>
        <div class="artwork-info">
          <div class="artwork-title">Untitled</div>
          <div class="artwork-date">2024</div>
        </div>
      </div>

    </div>
  </div>

  <!-- HIKE Zine flipbook modal -->
  <div class="flipbook-modal" id="flipbook-modal">
    <div class="flipbook-container">
      <div class="flipbook-nav">
        <button class="flipbook-btn" id="fb-prev">&#8592;</button>
        <div class="flipbook-img-wrap">
          <button class="flipbook-close" id="fb-close">&#x2715;</button>
          <img class="flipbook-img" id="fb-img" src="" alt="Zine page">
        </div>
        <button class="flipbook-btn" id="fb-next">&#8594;</button>
      </div>
      <div class="flipbook-counter" id="fb-counter"></div>
    </div>
  </div>

  <a href="photography.html" class="back-btn nav-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a89dc8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back
  </a>
  <div class="transition-overlay" id="overlay"></div>
  <div class="cursor" id="cursor">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="62" rx="26" ry="22"/>
      <ellipse cx="24" cy="38" rx="12" ry="10"/>
      <ellipse cx="44" cy="28" rx="12" ry="10"/>
      <ellipse cx="64" cy="28" rx="12" ry="10"/>
      <ellipse cx="78" cy="38" rx="12" ry="10"/>
    </svg>
  </div>

  <script>
    /* ── Flipbook ── */
    const zinePages = [
      'images/HIKE-zine1.png','images/HIKE-zine2.png','images/HIKE-zine3.png','images/HIKE-zine4.png',
      'images/HIKE-zine5.png','images/HIKE-zine6.png','images/HIKE-zine7.png',
      'images/HIKE-zine8.png','images/HIKE-zine9.png','images/HIKE-zine10.png',
      'images/HIKE-zine11.png','images/HIKE-zine12.png','images/HIKE-zine13.png',
      'images/HIKE-zine14.png','images/HIKE-zine15.png','images/HIKE-zine16.png',
      'images/HIKE-zine17.png','images/HIKE-zine18.png','images/HIKE-zine19.png',
      'images/HIKE-zine20.png','images/HIKE-zine21.png','images/HIKE-zine22.png',
      'images/HIKE-zine23.png','images/HIKE-zine24.png'
    ];
    let fbIndex = 0;
    const modal   = document.getElementById('flipbook-modal');
    const fbImg   = document.getElementById('fb-img');
    const fbCount = document.getElementById('fb-counter');

    function fbShow(i) {
      fbIndex = Math.max(0, Math.min(zinePages.length - 1, i));
      fbImg.src = zinePages[fbIndex];
      fbCount.textContent = `${fbIndex + 1} / ${zinePages.length}`;
    }
    document.getElementById('zine-open-btn').addEventListener('click', () => {
      fbShow(0);
      modal.classList.add('open');
    });
    document.getElementById('fb-close').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('fb-prev').addEventListener('click', () => fbShow(fbIndex - 1));
    document.getElementById('fb-next').addEventListener('click', () => fbShow(fbIndex + 1));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'ArrowRight') fbShow(fbIndex + 1);
      if (e.key === 'ArrowLeft')  fbShow(fbIndex - 1);
      if (e.key === 'Escape')     modal.classList.remove('open');
    });

    /* ── Cursor ── */
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
      spawnSparkle(e.clientX, e.clientY);
    });
    let lastSparkle = 0;
    function spawnSparkle(x, y) {
      const now = Date.now();
      if (now - lastSparkle < 80) return;
      lastSparkle = now;
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = x + 'px'; el.style.top = y + 'px';
      const colors = ['#c4b8e8','#f9d4e8','#b8d8f0','#ffeea0'];
      const color = colors[Math.floor(Math.random()*colors.length)];
      el.innerHTML = `<svg viewBox="0 0 24 24"><path fill="${color}" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>`;
      el.style.width = (10+Math.random()*12)+'px'; el.style.height = el.style.width;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }
    window.addEventListener('pageshow', () => {
      document.getElementById('overlay').classList.remove('active');
    });
    document.querySelectorAll('.nav-btn').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href && href !== '#') {
          e.preventDefault();
          document.getElementById('overlay').classList.add('active');
          setTimeout(() => { window.location.href = href; }, 300);
        }
      });
    });
  </script>
</body>
</html>
