<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Rammel Z.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: sans-serif;
      cursor: none;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('images/bg.png');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    nav {
      position: relative;
      z-index: 10; display: flex; align-items: center;
      padding: 18px 32px 0 24px;
    }
    .nav-logo { height: 60px; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: 20px; margin-left: auto; }
    .nav-links a { display: block; cursor: none; transition: transform 0.2s ease; }
    .nav-links a:hover { transform: scale(1.08) rotate(-2deg); }
    .nav-links img { height: 80px; object-fit: contain; }
    .nav-links a:nth-child(1) img { height: 52px; }
    .nav-line {
      margin: 0 24px;
      height: 2px;
      background: linear-gradient(90deg, #b8b0d8, #d4c8e8, #b8b0d8);
      z-index: 10; border-radius: 2px;
    }

    .page-content {
      padding-top: 24px;
      padding-bottom: 80px;
      min-height: calc(100vh - 90px);
      position: relative;
      overflow: hidden;
    }

    /* Cloud layer */
    .clouds {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .cloud {
      position: absolute;
      opacity: 0.55;
    }
    .cloud-1  { top: 8%;  left: -4%;  animation: drift1 18s ease-in-out infinite; }
    .cloud-2  { top: 22%; right: 2%;  animation: drift2 22s ease-in-out infinite; }
    .cloud-3  { top: 50%; left: 10%;  animation: drift1 26s ease-in-out infinite 3s; }
    .cloud-4  { top: 68%; right: 8%;  animation: drift2 20s ease-in-out infinite 5s; }
    .cloud-5  { top: 35%; left: 45%;  animation: drift1 24s ease-in-out infinite 8s; opacity: 0.35; }

    @keyframes drift1 {
      0%,100% { transform: translateX(0px) translateY(0px); }
      33%      { transform: translateX(18px) translateY(-8px); }
      66%      { transform: translateX(-10px) translateY(6px); }
    }
    @keyframes drift2 {
      0%,100% { transform: translateX(0px) translateY(0px); }
      33%      { transform: translateX(-14px) translateY(6px); }
      66%      { transform: translateX(10px) translateY(-10px); }
    }

    /* Page title */
    .page-title {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
      animation: floatIn 0.6s ease both;
    }
    .page-title img {
      height: 220px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(160,140,210,0.3));
    }

    /* Year buttons */
    .years-container {
      position: relative;
      min-height: 380px;
      max-width: 900px;
      margin: 0 auto;
      z-index: 2;
    }

    .year-btn {
      position: absolute;
      cursor: none;
    }

    .year-btn:nth-child(1) { left: 6%;  top: 40px;  animation: floatIn 0.6s ease both 0.15s, float1 3.2s ease-in-out infinite 0.8s; }
    .year-btn:nth-child(2) { left: 38%; top: 190px; animation: floatIn 0.6s ease both 0.25s, float2 3.8s ease-in-out infinite 1.0s; }
    .year-btn:nth-child(3) { left: 68%; top: 330px; animation: floatIn 0.6s ease both 0.35s, float3 3.5s ease-in-out infinite 1.2s; }

    @keyframes float1 {
      0%,100% { transform: translateY(0px)   rotate(-2deg); }
      50%      { transform: translateY(-14px) rotate(-2deg); }
    }
    @keyframes float2 {
      0%,100% { transform: translateY(10px)  rotate(1.5deg); }
      50%      { transform: translateY(-4px)  rotate(1.5deg); }
    }
    @keyframes float3 {
      0%,100% { transform: translateY(-8px)  rotate(2deg); }
      50%      { transform: translateY(-22px) rotate(2deg); }
    }

    @keyframes floatIn {
      from { opacity: 0; transform: scale(0.85) translateY(16px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    .year-btn:hover img { filter: drop-shadow(0 8px 24px rgba(160,140,210,0.45)) brightness(1.05); }

    .year-btn img {
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(160,140,210,0.3));
      transition: filter 0.25s ease;
    }

    /* Decorative sparkle stars */
    .deco-star {
      position: absolute;
      pointer-events: none;
      opacity: 0.6;
      animation: twinkle 2s ease-in-out infinite;
      z-index: 2;
    }
    .deco-star:nth-child(4) { left: 28%; top: 90px;  animation-delay: 0s; }
    .deco-star:nth-child(5) { left: 62%; top: 70px;  animation-delay: 0.5s; }
    .deco-star:nth-child(6) { left: 18%; top: 280px; animation-delay: 1s; }
    .deco-star:nth-child(7) { left: 82%; top: 200px; animation-delay: 0.3s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* Cursor */
    .cursor {
      position: fixed; width: 32px; height: 32px;
      left: 0; top: 0;
      pointer-events: none; z-index: 9999;
      will-change: transform;
    }
    .cursor svg { width: 100%; height: 100%; fill: #a89dc8; opacity: 0.85; }
    .sparkle {
      position: fixed; pointer-events: none; z-index: 9998;
      animation: sparkle-fade 0.7s ease forwards;
    }
    @keyframes sparkle-fade {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.2) rotate(60deg); }
    }
    .transition-overlay {
      position: fixed; inset: 0; background: #e8e4f4;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .transition-overlay.active { opacity: 1; pointer-events: all; }

    @media (hover: none) {
      body { cursor: auto; }
      .cursor { display: none; }
      .year-btn { cursor: auto; }
    }
    @media (max-width: 768px) {
      nav { padding: 10px 14px 0 12px; }
      .nav-logo { height: 44px; }
      .nav-links { gap: 6px; }
      .nav-links img { height: 44px; }
      .nav-links a:nth-child(1) img { height: 34px; }
      .nav-line { margin: 0 12px; }
      .page-title img { height: 120px; }
      .page-title { margin-bottom: 28px; }
      .years-container {
        min-height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding-bottom: 40px;
      }
      .year-btn { position: static !important; }
      .year-btn img { height: 90px; }
      .deco-star { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html"><img class="nav-logo" src="images/logo.png" alt="Logo"></a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn"><img src="images/nav_home.png" alt="Home"></a>
      <a href="illustration.html" class="nav-btn"><img src="images/nav_ill.png" alt="Illustration"></a>
      <a href="photography.html" class="nav-btn"><img src="images/nav_photo.png" alt="Photography"></a>
      <a href="about.html" class="nav-btn"><img src="images/nav_about.png" alt="About Me"></a>
    </div>
  </nav>
  <div class="nav-line"></div>

  <div class="page-content">

    <!-- Cloud background layer -->
    <div class="clouds">
      <!-- Cloud 1 -->
      <svg class="cloud cloud-1" width="260" height="100" viewBox="0 0 260 100">
        <ellipse cx="130" cy="72" rx="120" ry="28" fill="white"/>
        <ellipse cx="80"  cy="56" rx="52"  ry="38" fill="white"/>
        <ellipse cx="130" cy="48" rx="60"  ry="44" fill="white"/>
        <ellipse cx="185" cy="58" rx="48"  ry="34" fill="white"/>
      </svg>
      <!-- Cloud 2 -->
      <svg class="cloud cloud-2" width="200" height="80" viewBox="0 0 200 80">
        <ellipse cx="100" cy="58" rx="90"  ry="22" fill="white"/>
        <ellipse cx="60"  cy="44" rx="40"  ry="30" fill="white"/>
        <ellipse cx="100" cy="36" rx="46"  ry="34" fill="white"/>
        <ellipse cx="145" cy="46" rx="38"  ry="26" fill="white"/>
      </svg>
      <!-- Cloud 3 -->
      <svg class="cloud cloud-3" width="300" height="110" viewBox="0 0 300 110">
        <ellipse cx="150" cy="82" rx="140" ry="28" fill="white"/>
        <ellipse cx="90"  cy="64" rx="60"  ry="44" fill="white"/>
        <ellipse cx="155" cy="54" rx="70"  ry="50" fill="white"/>
        <ellipse cx="218" cy="66" rx="54"  ry="38" fill="white"/>
      </svg>
      <!-- Cloud 4 -->
      <svg class="cloud cloud-4" width="220" height="86" viewBox="0 0 220 86">
        <ellipse cx="110" cy="64" rx="100" ry="22" fill="white"/>
        <ellipse cx="65"  cy="50" rx="46"  ry="34" fill="white"/>
        <ellipse cx="115" cy="42" rx="52"  ry="38" fill="white"/>
        <ellipse cx="165" cy="52" rx="42"  ry="28" fill="white"/>
      </svg>
      <!-- Cloud 5 (small, centre) -->
      <svg class="cloud cloud-5" width="160" height="64" viewBox="0 0 160 64">
        <ellipse cx="80"  cy="48" rx="72"  ry="16" fill="white"/>
        <ellipse cx="46"  cy="36" rx="34"  ry="26" fill="white"/>
        <ellipse cx="84"  cy="30" rx="40"  ry="30" fill="white"/>
        <ellipse cx="122" cy="38" rx="30"  ry="20" fill="white"/>
      </svg>
    </div>

    <div class="page-title">
      <img src="images/nav_photo.png" alt="Photography">
    </div>

    <div class="years-container">
      <a href="photo_2023.html" class="year-btn nav-btn">
        <img src="images/photo_2023.png" alt="2023">
      </a>
      <a href="photo_2024.html" class="year-btn nav-btn">
        <img src="images/photo_2024.png" alt="2024">
      </a>
      <a href="photo_2025.html" class="year-btn nav-btn">
        <img src="images/photo_2025.png" alt="2025">
      </a>

      <!-- Decorative stars -->
      <div class="deco-star">
        <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#c4b8e8" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
      <div class="deco-star">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#f9d4e8" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
      <div class="deco-star">
        <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#b8d8f0" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
      <div class="deco-star">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#ffeea0" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
    </div>
  </div>

  <div class="transition-overlay" id="overlay"></div>
  <div class="cursor" id="cursor">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="62" rx="26" ry="22"/>
      <ellipse cx="24" cy="38" rx="12" ry="10"/>
      <ellipse cx="44" cy="28" rx="12" ry="10"/>
      <ellipse cx="64" cy="28" rx="12" ry="10"/>
      <ellipse cx="78" cy="38" rx="12" ry="10"/>
    </svg>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
      spawnSparkle(e.clientX, e.clientY);
    });
    let lastSparkle = 0;
    function spawnSparkle(x, y) {
      const now = Date.now();
      if (now - lastSparkle < 80) return;
      lastSparkle = now;
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = x + 'px'; el.style.top = y + 'px';
      const colors = ['#c4b8e8','#f9d4e8','#b8d8f0','#ffeea0'];
      const color = colors[Math.floor(Math.random()*colors.length)];
      el.innerHTML = `<svg viewBox="0 0 24 24"><path fill="${color}" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>`;
      el.style.width = (10+Math.random()*12)+'px'; el.style.height = el.style.width;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }
    window.addEventListener('pageshow', () => {
      document.getElementById('overlay').classList.remove('active');
    });

    document.querySelectorAll('.nav-btn').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href && href !== '#') {
          e.preventDefault();
          document.getElementById('overlay').classList.add('active');
          setTimeout(() => { window.location.href = href; }, 300);
        }
      });
    });
  </script>
</body>
</html>
