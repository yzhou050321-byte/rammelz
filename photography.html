<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Rammel Z.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: sans-serif;
      cursor: none;
      background-image: url('images/bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    nav {
      position: relative;
      z-index: 10; display: flex; align-items: center;
      padding: 18px 32px 0 24px;
    }
    .nav-logo { height: 60px; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .nav-links a { display: block; cursor: none; transition: transform 0.2s ease; }
    .nav-links a:hover { transform: scale(1.08) rotate(-2deg); }
    .nav-links img { height: 60px; object-fit: contain; }
    .nav-links a:nth-child(1) img { height: 40px; }
    .nav-line {
      margin: 0 24px;
      height: 2px;
      background: linear-gradient(90deg, #b8b0d8, #d4c8e8, #b8b0d8);
      z-index: 10; border-radius: 2px;
    }

    .page-content {
      padding-top: 24px;
      padding-bottom: 80px;
      min-height: 100vh;
      position: relative;
    }

    /* Page title */
    .page-title {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .page-title img {
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(160,140,210,0.3));
    }

    /* Year buttons scattered layout */
    .years-container {
      position: relative;
      min-height: 500px;
      max-width: 900px;
      margin: 0 auto;
    }

    .year-btn {
      position: absolute;
      cursor: none;
      transition: transform 0.25s ease;
      animation: floatIn 0.6s ease both;
    }

    .year-btn:nth-child(1) { left: 8%; top: 60px; animation-delay: 0.1s; }
    .year-btn:nth-child(2) { left: 42%; top: 180px; animation-delay: 0.2s; }
    .year-btn:nth-child(3) { left: 72%; top: 320px; animation-delay: 0.3s; }

    @keyframes floatIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .year-btn:hover { transform: scale(1.1) rotate(-2deg); }

    .year-btn img {
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(160,140,210,0.3));
    }

    /* Decorative sparkle stars */
    .deco-star {
      position: absolute;
      pointer-events: none;
      opacity: 0.6;
      animation: twinkle 2s ease-in-out infinite;
    }
    .deco-star:nth-child(4) { left: 30%; top: 100px; animation-delay: 0s; }
    .deco-star:nth-child(5) { left: 65%; top: 80px; animation-delay: 0.5s; }
    .deco-star:nth-child(6) { left: 20%; top: 280px; animation-delay: 1s; }
    .deco-star:nth-child(7) { left: 85%; top: 200px; animation-delay: 0.3s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* Cursor */
    .cursor {
      position: fixed; width: 32px; height: 32px;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor svg { width: 100%; height: 100%; fill: #a89dc8; opacity: 0.85; }
    .sparkle {
      position: fixed; pointer-events: none; z-index: 9998;
      animation: sparkle-fade 0.7s ease forwards;
    }
    @keyframes sparkle-fade {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.2) rotate(60deg); }
    }
    .transition-overlay {
      position: fixed; inset: 0; background: #e8e4f4;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .transition-overlay.active { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html"><img class="nav-logo" src="images/logo.png" alt="Logo"></a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn"><img src="images/nav_home.png" alt="Home"></a>
      <a href="illustration.html" class="nav-btn"><img src="images/nav_ill.png" alt="Illustration"></a>
      <a href="photography.html" class="nav-btn"><img src="images/nav_photo.png" alt="Photography"></a>
      <a href="about.html" class="nav-btn"><img src="images/nav_about.png" alt="About Me"></a>
    </div>
  </nav>
  <div class="nav-line"></div>

  <div class="page-content">
    <div class="page-title">
      <img src="images/nav_photo.png" alt="Photography">
    </div>

    <div class="years-container">
      <a href="photo_2023.html" class="year-btn nav-btn">
        <img src="images/photo_2023.png" alt="2023">
      </a>
      <a href="photo_2024.html" class="year-btn nav-btn">
        <img src="images/photo_2024.png" alt="2024">
      </a>
      <a href="photo_2025.html" class="year-btn nav-btn">
        <img src="images/photo_2025.png" alt="2025">
      </a>

      <!-- Decorative stars -->
      <div class="deco-star">
        <svg width="28" height="28" viewBox="0 0 24 24"><path fill="#c4b8e8" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
      <div class="deco-star">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#f9d4e8" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
      <div class="deco-star">
        <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#b8d8f0" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
      <div class="deco-star">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#ffeea0" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>
      </div>
    </div>
  </div>

  <div class="transition-overlay" id="overlay"></div>
  <div class="cursor" id="cursor">
    <svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="62" rx="26" ry="22"/>
      <ellipse cx="24" cy="38" rx="12" ry="10"/>
      <ellipse cx="44" cy="28" rx="12" ry="10"/>
      <ellipse cx="64" cy="28" rx="12" ry="10"/>
      <ellipse cx="78" cy="38" rx="12" ry="10"/>
    </svg>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      spawnSparkle(e.clientX, e.clientY);
    });
    let lastSparkle = 0;
    function spawnSparkle(x, y) {
      const now = Date.now();
      if (now - lastSparkle < 80) return;
      lastSparkle = now;
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = x + 'px'; el.style.top = y + 'px';
      const colors = ['#c4b8e8','#f9d4e8','#b8d8f0','#ffeea0'];
      const color = colors[Math.floor(Math.random()*colors.length)];
      el.innerHTML = `<svg viewBox="0 0 24 24"><path fill="${color}" d="M12 2 L13.5 10 L21 12 L13.5 14 L12 22 L10.5 14 L3 12 L10.5 10 Z"/></svg>`;
      el.style.width = (10+Math.random()*12)+'px'; el.style.height = el.style.width;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }
    window.addEventListener('pageshow', () => {
      document.getElementById('overlay').classList.remove('active');
    });

    document.querySelectorAll('.nav-btn').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href && href !== '#') {
          e.preventDefault();
          document.getElementById('overlay').classList.add('active');
          setTimeout(() => { window.location.href = href; }, 300);
        }
      });
    });
  </script>
</body>
</html>
